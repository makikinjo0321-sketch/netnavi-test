<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ネットナビ 音声試作 v0.5</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163b69,#071225 75%);color:#edf7ff;font-family:system-ui,sans-serif;min-height:100dvh}main{max-width:720px;margin:auto;padding:25px 16px;text-align:center}h1{letter-spacing:.13em}small{color:#9fc4df}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:25px 0}.card{background:#102b49;border:2px solid #315b81;border-radius:17px;padding:14px 8px;color:white;cursor:pointer;font-size:17px}.card:focus,.card:hover{border-color:#61dcff}.avatar{height:116px;position:relative;margin:0 auto 8px;width:100px}.helm{position:absolute;top:6px;left:10px;width:80px;height:85px;border:8px solid var(--c);border-radius:44% 44% 35% 35%;background:#f2c9aa;box-shadow:0 0 18px var(--c)}.visor{position:absolute;top:41px;left:22px;width:56px;height:19px;background:#173451;border-radius:12px}.body{position:absolute;bottom:0;left:16px;width:68px;height:28px;background:var(--c);border-radius:18px 18px 4px 4px}.selected{border-color:#65e8f6;background:#16466a}button.action{background:#16b5e3;color:#031626;border:0;border-radius:100px;padding:18px 28px;font-size:19px;font-weight:bold;cursor:pointer;margin:15px}button:disabled{opacity:.5}#chat{display:none}#status{margin:18px auto;min-height:48px;line-height:1.7}#help{color:#ffcb89;line-height:1.6}#back{background:none;border:1px solid #6b9ab9;color:white;border-radius:12px;padding:10px} .pulse{animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 25px #16b5e3}}</style></head><body><main><h1>NET NAVI</h1><small>個人用・音声会話プロトタイプ v0.5</small><section id="pick"><h2>パートナーを選択</h2><div class="grid" id="cards"></div><small>イラストはオリジナルの仮デザインです（公式画像ではありません）</small></section><section id="chat"><h2 id="name"></h2><p id="status" aria-live="polite">マイクボタンを押して話しかけてください</p><button class="action" id="mic">🎙 話しかける</button><div id="help" aria-live="polite"></div><p><button id="back">ナビを選び直す</button></p></section><p><small>音声認識はブラウザと通信環境に依存します。HTTPS公開後にChrome等でお試しください。</small></p></main><script>
const navs=[{n:'ロックマン',c:'#1689ec',intro:'こんにちは！ 一緒に頑張ろう！',words:['一緒に考えてみよう！','大丈夫、きっとできるよ！']},{n:'ガッツマン',c:'#f2a52a',intro:'おう！ ガッツマンだぜ！',words:['任せとけ！','よっしゃ、やってやろうぜ！']},{n:'ロール',c:'#ef6ba7',intro:'こんにちは！ お話ししようね！',words:['それは楽しそうね！','無理しないでね。']},{n:'グライド',c:'#67c6a0',intro:'ごきげんよう。よろしくお願いいたします。',words:['承知いたしました。','お役に立てれば幸いです。']},{n:'ブルース',c:'#dc4857',intro:'ブルースだ。よろしく頼む。',words:['冷静に判断しよう。','悪くない考えだ。']}];let active=null,rec=null,busy=false;const $=id=>document.getElementById(id);const cards=$('cards');navs.forEach((n,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="avatar" style="--c:'+n.c+'"><div class="helm"></div><div class="visor"></div><div class="body"></div></div>'+n.n;b.onclick=()=>select(i);cards.append(b)});function say(s){if(!('speechSynthesis'in window)){ $('help').textContent='音声読み上げ非対応のブラウザです。';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=1;speechSynthesis.speak(u)}function select(i){active=i;$('pick').style.display='none';$('chat').style.display='block';$('name').textContent=navs[i].n;$('status').textContent='マイクを押して話しかけてください';$('help').textContent='';say(navs[i].intro)}$('back').onclick=()=>{if(rec)rec.abort();speechSynthesis.cancel();$('chat').style.display='none';$('pick').style.display='block'};function errorMessage(e){return ({'not-allowed':'マイクが許可されていません。ブラウザのサイト設定で許可してください。','service-not-allowed':'音声認識サービスが利用できません。Chrome等でHTTPSサイトを開いてください。','network':'音声認識サービスへの通信に失敗しました。接続を確認してください。','no-speech':'声を検出できませんでした。もう一度話してください。','audio-capture':'マイクが見つからないか、他のアプリが使用しています。','language-not-supported':'日本語の音声認識に対応していません。'}[e]||'音声認識エラー: '+e)}$('mic').onclick=()=>{if(busy)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('help').textContent='このブラウザは音声認識に対応していません。AndroidではChromeのHTTPSサイトからお試しください。iPhoneではSafari等で対応状況を確認してください。';return}if(!window.isSecureContext){$('help').textContent='安全な接続ではありません。HTTPSで公開したURLから開いてください。';return}speechSynthesis.cancel();rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{busy=true;$('mic').classList.add('pulse');$('status').textContent='聞いています…';$('help').textContent=''};rec.onresult=e=>{const t=e.results[0][0].transcript;const n=navs[active];let reply;if(/名前|誰/.test(t))reply=n.intro;else if(/ありがとう/.test(t))reply='どういたしまして！';else if(/こんにちは|おはよう|こんばんは/.test(t))reply=n.intro;else reply=n.words[Math.floor(Math.random()*n.words.length)];$('status').textContent='返事しています…';say(reply)};rec.onerror=e=>{$('help').textContent=errorMessage(e.error);$('status').textContent='もう一度お試しください'};rec.onend=()=>{busy=false;$('mic').classList.remove('pulse');if($('status').textContent==='聞いています…')$('status').textContent='もう一度話しかけてください'};try{rec.start()}catch(e){$('help').textContent='開始できません: '+e.message}};</script></body></html>
